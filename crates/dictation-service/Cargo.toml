[package]
name = "dictation-service"
version.workspace = true
edition.workspace = true

[lib]
name = "dictation_service"

[[bin]]
name = "dictation"
path = "src/main.rs"

[features]
default = []
evdev = ["dep:evdev"]

[dependencies]
whisper-burn = { path = "../whisper-burn", features = ["audio"] }
burn = { workspace = true, features = ["wgpu", "ndarray"] }
serde.workspace = true
toml.workspace = true
dirs.workspace = true
clap.workspace = true
log.workspace = true
cpal = "0.15"
arboard = "3"
enigo = "0.3"
interprocess = "2"
rdev = "0.5"
tray-icon = "0.19"
tao = "0.30"
notify-rust = "4"
eframe = "0.29"
thiserror.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1.11.0"
