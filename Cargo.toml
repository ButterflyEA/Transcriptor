[package]
name = "transcriptor"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7"
actix-multipart = "0.7"
actix-web = "4.11"
anyhow = "1"
byteorder = "1.5"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
futures-util = "0.3"
hf-hub = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokenizers = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
