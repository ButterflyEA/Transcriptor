[workspace]
resolver = "2"
members = ["crates/whisper-burn", "crates/whisper-burn-cli", "crates/transcriptor/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
fancy-regex = "0.19.2"
ureq = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
symphonia = "0.6.1"
rubato = "5.0.0"
docx-rs = "0.3"
printpdf = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }